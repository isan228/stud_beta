<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icon-192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta property="og:image" content="https://stud.kg/img/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2563eb">
    <title>Регистрация - stud.kg</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/"><h1>stud.kg</h1></a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container" style="max-width: 480px;">
            <h2>Регистрация</h2>
            <p style="color: var(--text-secondary); margin: -0.5rem 0 1.5rem; text-align: center;">
                Создайте аккаунт бесплатно. Подписку можно оформить позже во вкладке «Подписки».
            </p>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername">Никнейм</label>
                    <input type="text" id="regUsername" name="username" required minlength="3" maxlength="50" placeholder="Введите ваш никнейм">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="regUniversity">Университет</label>
                    <select id="regUniversity" name="universityId" required>
                        <option value="">Загрузка...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" name="password" required minlength="6" placeholder="Минимум 6 символов">
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Подтвердите пароль</label>
                    <input type="password" id="regConfirmPassword" name="confirmPassword" required placeholder="Повторите пароль">
                </div>
                <div class="form-group" id="promoCodeGroup">
                    <label for="regPromoCode">Реферальный код (если есть)</label>
                    <input type="text" id="regPromoCode" name="referralCode" placeholder="Необязательно">
                    <small id="regPromoCodeHint" style="display: none; color: var(--text-muted); margin-top: 0.4rem;">
                        Вы уже перешли по бонусной ссылке
                    </small>
                </div>
                <div class="form-group checkbox-group">
                    <label for="dataConsent">
                        <input type="checkbox" id="dataConsent" name="dataConsent" value="true" required>
                        <span>Согласие на <a href="/contact" data-doc="privacy" target="_blank" rel="noopener">обработку персональных данных</a></span>
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label for="publicOffer">
                        <input type="checkbox" id="publicOffer" name="publicOffer" value="true" required>
                        <span>Согласие с <a href="/contact" data-doc="offer" target="_blank" rel="noopener">публичной офертой</a></span>
                    </label>
                </div>
                <div class="account-warning" style="margin-bottom: 1rem;">
                    <p class="account-warning-title">⚠️ Внимание</p>
                    <p class="account-warning-text">
                        Передача доступа к аккаунту третьим лицам запрещена. При нарушении —
                        аккаунт удаляется без возможности восстановления.
                    </p>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="registerSubmitBtn">Зарегистрироваться</button>
                <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
            </form>
        </div>
    </main>

    <div id="notification" class="notification"></div>
    <script src="app.js"></script>
    <script>
        let referralCode = null;

        async function loadUniversitiesForRegister() {
            const select = document.getElementById('regUniversity');
            if (!select) return;
            try {
                const response = await fetch('/api/universities');
                if (!response.ok) throw new Error('Не удалось загрузить университеты');
                const universities = await response.json();
                if (!universities.length) {
                    select.innerHTML = '<option value="">Университеты пока не добавлены</option>';
                    return;
                }
                select.innerHTML = '<option value="">Выберите университет</option>' +
                    universities.map((u) =>
                        `<option value="${u.id}">${u.shortName} — ${u.name}</option>`
                    ).join('');
            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Ошибка загрузки</option>';
            }
        }

        function applyReferralLock() {
            const params = new URLSearchParams(window.location.search);
            const ref = (params.get('ref') || '').trim().toUpperCase();
            if (!ref) return;
            referralCode = ref;
            const promoGroup = document.getElementById('promoCodeGroup');
            const promoInput = document.getElementById('regPromoCode');
            const promoHint = document.getElementById('regPromoCodeHint');
            if (promoInput) {
                promoInput.value = ref;
                promoInput.disabled = true;
            }
            if (promoHint) promoHint.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initTheme === 'function') initTheme();
            loadUniversitiesForRegister();
            applyReferralLock();

            // Ссылки на документы из настроек
            fetch('/api/settings/docs').then(r => r.json()).then((docs) => {
                document.querySelectorAll('a[data-doc="privacy"]').forEach((a) => {
                    if (docs.privacyPolicyUrl) a.href = docs.privacyPolicyUrl;
                });
                document.querySelectorAll('a[data-doc="offer"]').forEach((a) => {
                    if (docs.publicOfferUrl) a.href = docs.publicOfferUrl;
                });
            }).catch(() => {});

            const form = document.getElementById('registerForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                e.stopImmediatePropagation();

                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const universityId = document.getElementById('regUniversity').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                const dataConsent = document.getElementById('dataConsent').checked;
                const publicOffer = document.getElementById('publicOffer').checked;
                const codeFromInput = document.getElementById('regPromoCode').value.trim();

                if (!universityId) {
                    showNotification('Выберите университет', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showNotification('Пароли не совпадают', 'error');
                    return;
                }
                if (!dataConsent || !publicOffer) {
                    showNotification('Необходимо принять соглашения', 'error');
                    return;
                }

                const btn = document.getElementById('registerSubmitBtn');
                btn.disabled = true;
                btn.textContent = 'Регистрация...';

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username,
                            email,
                            password,
                            confirmPassword,
                            universityId: parseInt(universityId, 10),
                            referralCode: referralCode || codeFromInput || undefined,
                            dataConsent: 'true',
                            publicOffer: 'true'
                        })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        const msg = data.error || data.errors?.[0]?.msg || 'Ошибка регистрации';
                        showNotification(msg, 'error');
                        btn.disabled = false;
                        btn.textContent = 'Зарегистрироваться';
                        return;
                    }

                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    } else {
                        // Fallback: логин после регистрации
                        const loginRes = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ identifier: email, password })
                        });
                        const loginData = await loginRes.json();
                        if (loginRes.ok && loginData.token) {
                            localStorage.setItem('token', loginData.token);
                        }
                    }

                    showNotification('Аккаунт создан! Переходим к подпискам…', 'success');
                    setTimeout(() => {
                        window.location.href = '/subscriptions?welcome=1';
                    }, 600);
                } catch (err) {
                    console.error(err);
                    showNotification('Ошибка соединения с сервером', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Зарегистрироваться';
                }
            }, true);
        });
    </script>
</body>
</html>
