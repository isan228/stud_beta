<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0d9488">
    <meta name="robots" content="noindex, nofollow">
    <title>Вход редактора — stud.kg</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/redact-login.css">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="redact-login-page">
    <div class="redact-login-bg" aria-hidden="true"></div>

    <header class="redact-login-top">
        <a href="/" class="redact-login-brand">
            <span>STUD</span>.kg
        </a>
        <button type="button" class="redact-login-theme" id="redactThemeToggle" aria-label="Переключить тему">🌙</button>
    </header>

    <main class="redact-login-main">
        <div class="redact-login-card">
            <div class="redact-login-card-header">
                <div class="redact-login-icon" aria-hidden="true">✏️</div>
                <h1>Панель редактора</h1>
                <p class="redact-login-subtitle">Вход для сотрудников, которые правят вопросы и разбирают отчёты об ошибках</p>
            </div>

            <ul class="redact-login-features">
                <li>Редактирование вопросов и ответов в тестах</li>
                <li>Просмотр списка тестов и предметов</li>
                <li>Обработка сообщений об ошибках от пользователей</li>
            </ul>

            <form id="editorLoginForm" class="redact-login-form auth-form" novalidate>
                <div class="form-group">
                    <label for="editorUsername">Логин</label>
                    <input type="text" id="editorUsername" name="username" required autocomplete="username" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="editorPassword">Пароль</label>
                    <input type="password" id="editorPassword" name="password" required autocomplete="current-password" placeholder="Введите пароль">
                </div>
                <button type="submit" class="redact-login-submit" id="editorLoginSubmit">Войти в панель</button>
            </form>

            <div id="editorLoginError" class="redact-login-error" role="alert"></div>

            <p class="redact-login-footer">
                Доступ выдаёт <a href="/admin">администратор</a> · <a href="/">На главную</a>
            </p>
        </div>
    </main>

    <script>
        const REDACT_API = '/api/redact';

        function updateThemeIcon(theme) {
            const btn = document.getElementById('redactThemeToggle');
            if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        document.getElementById('redactThemeToggle').addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        });

        updateThemeIcon(document.documentElement.getAttribute('data-theme') || localStorage.getItem('theme') || 'light');

        function showLoginError(msg) {
            const el = document.getElementById('editorLoginError');
            if (!el) return;
            el.textContent = msg;
            el.classList.toggle('is-visible', Boolean(msg));
        }

        function setLoading(loading) {
            const btn = document.getElementById('editorLoginSubmit');
            if (btn) {
                btn.disabled = loading;
                btn.textContent = loading ? 'Вход…' : 'Войти в панель';
            }
        }

        if (localStorage.getItem('editorToken')) {
            window.location.href = '/redact';
        }

        document.getElementById('editorLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            showLoginError('');
            const username = document.getElementById('editorUsername').value.trim();
            const password = document.getElementById('editorPassword').value;

            if (!username || !password) {
                showLoginError('Введите логин и пароль');
                return;
            }

            setLoading(true);
            try {
                const response = await fetch(REDACT_API + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok) {
                    showLoginError(data.error || 'Неверный логин или пароль');
                    return;
                }
                localStorage.setItem('editorToken', data.token);
                window.location.href = '/redact';
            } catch (err) {
                console.error(err);
                showLoginError('Не удалось подключиться к серверу');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
