<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icon-192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta property="og:image" content="https://stud.kg/img/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2563eb">
    <title>Конструктор теста — USMLE stud.kg</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .builder-wrap {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ── Breadcrumb ── */
        .builder-breadcrumb {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-size: .875rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
        }

        .builder-breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .builder-breadcrumb a:hover { text-decoration: underline; }

        .builder-breadcrumb-sep {
            opacity: .4;
        }

        /* ── Page header ── */
        .builder-header {
            margin-bottom: 2rem;
        }

        .builder-header h1 {
            font-size: 1.625rem;
            font-weight: 700;
            margin: 0 0 .4rem;
            color: var(--text-color);
        }

        .builder-header p {
            font-size: .9rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.55;
        }

        /* ── Tag group card ── */
        .tag-group {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg, 1rem);
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .tag-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .9rem 1.25rem;
            cursor: pointer;
            user-select: none;
            background: var(--bg-secondary);
            gap: 1rem;
            transition: background .15s;
        }

        .tag-group-header:hover {
            background: color-mix(in srgb, var(--primary-color) 5%, var(--bg-secondary));
        }

        .tag-group.open .tag-group-header {
            border-bottom: 1px solid var(--border-light);
        }

        .tag-group-left {
            display: flex;
            align-items: center;
            gap: .75rem;
            min-width: 0;
        }

        .master-checkbox {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .tag-group-label {
            font-size: .95rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .tag-group-badge {
            font-size: .75rem;
            font-weight: 600;
            color: var(--primary-color);
            background: color-mix(in srgb, var(--primary-color) 12%, var(--card-bg));
            border-radius: 999px;
            padding: .15rem .55rem;
            display: none;
        }

        .tag-group-badge.visible { display: inline-block; }

        .tag-group-right {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-shrink: 0;
        }

        .tag-group-count {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .tag-group-chevron {
            width: 1rem;
            height: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: transform .22s;
            flex-shrink: 0;
        }

        .tag-group-chevron svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .tag-group.open .tag-group-chevron { transform: rotate(180deg); }

        .tag-group-body {
            display: none;
            padding: 1rem 1.25rem 1.25rem;
        }

        .tag-group.open .tag-group-body { display: block; }

        /* ── Tag grid ── */
        .tag-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .25rem .5rem;
        }

        .tag-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            padding: .5rem .65rem;
            border-radius: .45rem;
            cursor: pointer;
            transition: background .12s;
            border: 1px solid transparent;
        }

        .tag-item:hover {
            background: var(--bg-secondary);
            border-color: var(--border-light);
        }

        .tag-item.selected {
            background: color-mix(in srgb, var(--primary-color) 9%, var(--card-bg));
            border-color: color-mix(in srgb, var(--primary-color) 25%, transparent);
        }

        .tag-item-left {
            display: flex;
            align-items: center;
            gap: .6rem;
            min-width: 0;
        }

        .tag-checkbox {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .tag-name {
            font-size: .875rem;
            color: var(--text-color);
            line-height: 1.35;
            user-select: none;
        }

        .tag-item.zero-count {
            opacity: .45;
        }

        .tag-item.zero-count .tag-count {
            color: var(--text-muted);
        }

        .tag-count {
            flex-shrink: 0;
            font-size: .75rem;
            font-weight: 700;
            color: var(--primary-color);
            background: color-mix(in srgb, var(--primary-color) 12%, var(--card-bg));
            border-radius: 999px;
            padding: .15rem .5rem;
            line-height: 1.2;
            min-width: 1.6rem;
            text-align: center;
        }

        /* ── Settings panel ── */
        .builder-settings {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg, 1rem);
            box-shadow: var(--shadow);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .builder-settings-heading {
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 1rem;
        }

        .builder-settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem 1.5rem;
        }

        .builder-field {
            display: flex;
            flex-direction: column;
            gap: .4rem;
        }

        .builder-field label {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: .02em;
        }

        .builder-field input[type="number"] {
            padding: .6rem .85rem;
            border: 1.5px solid var(--border-color);
            border-radius: .5rem;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: .95rem;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .builder-field input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        /* ── Toggle pill group ── */
        .toggle-pills {
            display: flex;
            gap: .35rem;
            flex-wrap: wrap;
        }

        .toggle-pill {
            padding: .45rem .85rem;
            border: 1.5px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-color);
            color: var(--text-secondary);
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
            line-height: 1;
        }

        .toggle-pill:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .toggle-pill.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #fff;
        }

        /* ── Sticky footer ── */
        .builder-footer {
            position: sticky;
            bottom: 0;
            background: var(--bg-color);
            border-top: 1px solid var(--border-light);
            padding: .875rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            z-index: 20;
        }

        .builder-summary {
            font-size: .875rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .builder-summary strong {
            color: var(--text-color);
            font-weight: 700;
        }

        .builder-start-btn {
            padding: .8rem 2rem;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: .625rem;
            font-size: .975rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, box-shadow .2s, transform .1s;
            box-shadow: 0 2px 10px rgba(37,99,235,.28);
            min-width: 160px;
            letter-spacing: .01em;
        }

        .builder-start-btn:hover:not(:disabled) {
            background: #1d4ed8;
            box-shadow: 0 4px 18px rgba(37,99,235,.38);
        }

        .builder-start-btn:active:not(:disabled) { transform: scale(.98); }

        .builder-start-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-spinner {
            display: inline-block;
            width: .9rem;
            height: .9rem;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .65s linear infinite;
            vertical-align: middle;
            margin-right: .4rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Skeleton ── */
        .tag-skeleton {
            height: 2.25rem;
            border-radius: .5rem;
            background: var(--border-light);
            animation: blink 1.3s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: .5; }
            50% { opacity: .9; }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .tag-list { grid-template-columns: 1fr; }
            .builder-settings-grid { grid-template-columns: 1fr; }
            .builder-footer { flex-direction: column; align-items: stretch; }
            .builder-start-btn { width: 100%; text-align: center; min-width: 0; }
            .toggle-pill { flex: 1; text-align: center; }
            .builder-header h1 { font-size: 1.375rem; }

            .tag-item { padding: .6rem .65rem; }
            .tag-name, .tag-checkbox { font-size: 16px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="nav-brand">
            <a href="/"><h1>stud.kg</h1></a>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="navMenu">
            <a href="/" class="nav-link">Главная</a>
            <a href="/tests" class="nav-link">Тесты</a>
            <a href="/usmle" class="nav-link active">USMLE</a>
            <a href="/rating" class="nav-link">Рейтинг</a>
            <a href="/about" class="nav-link">О нас</a>
            <a href="/favorites" class="nav-link" id="favoritesLink" style="display:none;">Избранное</a>
            <a href="/subscriptions" class="nav-link" id="subscriptionsLink" style="display:none;">Подписки</a>
            <a href="/profile" class="nav-link" id="profileLink" style="display:none;">Профиль</a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                    <span class="theme-icon">🌙</span>
                </button>
                <a href="/login" class="btn btn-primary" id="loginBtn">Войти</a>
                <a href="/register" class="btn btn-secondary" id="registerBtn">Регистрация</a>
                <button class="btn btn-logout" id="logoutBtn" style="display:none;">Выход</button>
            </div>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <div class="builder-wrap">

            <!-- Breadcrumb -->
            <nav class="builder-breadcrumb" aria-label="Навигация">
                <a href="/usmle-create">Создать тест</a>
                <span class="builder-breadcrumb-sep">/</span>
                <span id="builderBreadcrumbName">Конструктор</span>
            </nav>

            <!-- Header -->
            <div class="builder-header">
                <h1 id="builderTitle">Создать тест</h1>
                <p id="builderSubtitle">Выберите Subjects и Systems — вопросы берутся только из выбранного банка.</p>
            </div>

            <!-- Skeleton -->
            <div id="builderLoading">
                <div class="tag-skeleton" style="height:3rem; margin-bottom:.75rem;"></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin-bottom:.75rem;">
                    <div class="tag-skeleton"></div><div class="tag-skeleton"></div>
                    <div class="tag-skeleton"></div><div class="tag-skeleton"></div>
                    <div class="tag-skeleton"></div><div class="tag-skeleton"></div>
                </div>
                <div class="tag-skeleton" style="height:3rem; margin-bottom:.75rem;"></div>
            </div>

            <!-- Main content -->
            <div id="builderContent" style="display:none;">

                <!-- Settings first -->
                <div class="builder-settings">
                    <p class="builder-settings-heading">Параметры теста</p>
                    <div class="builder-settings-grid">

                        <div class="builder-field">
                            <label for="qCountInput">Количество вопросов</label>
                            <input type="number" id="qCountInput" min="1" max="280" value="40">
                        </div>

                        <div class="builder-field">
                            <label>Режим вопросов</label>
                            <div class="toggle-pills">
                                <button type="button" class="toggle-pill active" data-mode="unsolved" onclick="selectMode(this)">Нерешённые</button>
                                <button type="button" class="toggle-pill" data-mode="all" onclick="selectMode(this)">Все</button>
                                <button type="button" class="toggle-pill" data-mode="incorrect" onclick="selectMode(this)">Неправильные</button>
                            </div>
                        </div>

                        <div class="builder-field">
                            <label>Режим теста</label>
                            <div class="toggle-pills">
                                <button type="button" class="toggle-pill" data-test-mode="instant" onclick="selectTestMode(this)">Ответы сразу</button>
                                <button type="button" class="toggle-pill active" data-test-mode="standard" onclick="selectTestMode(this)">С таймером</button>
                            </div>
                        </div>

                        <div class="builder-field" id="timerMinutesField">
                            <label for="usmleTimerMinutes">Время на блок (минуты)</label>
                            <input type="number" id="usmleTimerMinutes" min="1" max="600" value="60"
                                style="width:100px;padding:6px 10px;border:1px solid var(--border-color,#ddd);border-radius:8px;font-size:1rem;">
                        </div>

                        <div class="builder-field">
                            <label>Порядок ответов</label>
                            <div class="toggle-pills">
                                <button type="button" class="toggle-pill active" data-rand="true" onclick="selectRandom(this)">Перемешать</button>
                                <button type="button" class="toggle-pill" data-rand="false" onclick="selectRandom(this)">По порядку</button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Subjects -->
                <div class="tag-group open" id="groupSubjects">
                    <div class="tag-group-header" onclick="toggleGroup('groupSubjects')">
                        <div class="tag-group-left">
                            <input type="checkbox" class="master-checkbox" id="masterSubjects"
                                onclick="event.stopPropagation()"
                                onchange="toggleGroupAll('subjects', this.checked)"
                                aria-label="Выбрать все Subjects">
                            <span class="tag-group-label">Subjects</span>
                            <span class="tag-group-badge" id="subjectsBadge"></span>
                        </div>
                        <div class="tag-group-right">
                            <span class="tag-group-count" id="subjectsTotal"></span>
                            <span class="tag-group-chevron">
                                <svg viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z"/></svg>
                            </span>
                        </div>
                    </div>
                    <div class="tag-group-body">
                        <div class="tag-list" id="subjectsList"></div>
                    </div>
                </div>

                <!-- Systems -->
                <div class="tag-group open" id="groupSystems">
                    <div class="tag-group-header" onclick="toggleGroup('groupSystems')">
                        <div class="tag-group-left">
                            <input type="checkbox" class="master-checkbox" id="masterSystems"
                                onclick="event.stopPropagation()"
                                onchange="toggleGroupAll('systems', this.checked)"
                                aria-label="Выбрать все Systems">
                            <span class="tag-group-label">Systems</span>
                            <span class="tag-group-badge" id="systemsBadge"></span>
                        </div>
                        <div class="tag-group-right">
                            <span class="tag-group-count" id="systemsTotal"></span>
                            <span class="tag-group-chevron">
                                <svg viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z"/></svg>
                            </span>
                        </div>
                    </div>
                    <div class="tag-group-body">
                        <div class="tag-list" id="systemsList"></div>
                    </div>
                </div>

            </div>

            <!-- Sticky footer -->
            <div class="builder-footer" id="builderFooter" style="display:none;">
                <div class="builder-summary" id="builderSummary">
                    Выберите хотя бы одну тему или систему
                </div>
                <button class="builder-start-btn" id="startCustomTestBtn" onclick="startCustomTest()" disabled>
                    Начать тест
                </button>
            </div>

        </div>
    </div>
</main>

<div id="notification" class="notification"></div>
<script src="app.js"></script>
<script>
    const API_URL = '/api';
    const urlParams = new URLSearchParams(window.location.search);
    const currentTestId = parseInt(urlParams.get('testId'), 10);
    const currentTestName = (() => {
        try { return decodeURIComponent(urlParams.get('name') || ''); }
        catch { return urlParams.get('name') || ''; }
    })();
    const currentStep = urlParams.get('step') || '';

    const selectedSubjectIds = new Set();
    const selectedSystemIds  = new Set();
    let allSubjectTags = [];
    let allSystemTags  = [];
    let questionMode   = 'unsolved';
    let testMode       = 'standard';
    let usmleTimerMinutes = 60;
    let randomizeAnswers = true;

    /* ── Group accordion ── */
    function toggleGroup(id) {
        document.getElementById(id).classList.toggle('open');
    }

    /* ── Render ── */
    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function unionQuestionIds(selectedIds, tags) {
        if (!selectedIds.size) return null;
        const out = new Set();
        for (const tag of tags) {
            if (!selectedIds.has(tag.id)) continue;
            const ids = tag.questionIds || [];
            for (let i = 0; i < ids.length; i++) out.add(ids[i]);
        }
        return out;
    }

    function countIntersect(questionIds, filterSet) {
        const ids = questionIds || [];
        if (!filterSet) return ids.length;
        let n = 0;
        for (let i = 0; i < ids.length; i++) {
            if (filterSet.has(ids[i])) n++;
        }
        return n;
    }

    function filteredCountForTag(tag, group) {
        if (group === 'subjects') {
            return countIntersect(tag.questionIds, unionQuestionIds(selectedSystemIds, allSystemTags));
        }
        return countIntersect(tag.questionIds, unionQuestionIds(selectedSubjectIds, allSubjectTags));
    }

    function refreshFilteredCounts() {
        const subjectFilter = unionQuestionIds(selectedSubjectIds, allSubjectTags);
        const systemFilter = unionQuestionIds(selectedSystemIds, allSystemTags);

        document.querySelectorAll('#systemsList .tag-item').forEach((el) => {
            const id = Number(el.dataset.tagId);
            const tag = allSystemTags.find((t) => t.id === id);
            if (!tag) return;
            const count = countIntersect(tag.questionIds, subjectFilter);
            const countEl = el.querySelector('.tag-count');
            if (countEl) countEl.textContent = String(count);
            el.classList.toggle('zero-count', count === 0);
        });

        document.querySelectorAll('#subjectsList .tag-item').forEach((el) => {
            const id = Number(el.dataset.tagId);
            const tag = allSubjectTags.find((t) => t.id === id);
            if (!tag) return;
            const count = countIntersect(tag.questionIds, systemFilter);
            const countEl = el.querySelector('.tag-count');
            if (countEl) countEl.textContent = String(count);
            el.classList.toggle('zero-count', count === 0);
        });
    }

    function renderTagItem(tag, group) {
        const selected = group === 'subjects'
            ? selectedSubjectIds.has(tag.id)
            : selectedSystemIds.has(tag.id);

        const label = document.createElement('label');
        label.className = 'tag-item' + (selected ? ' selected' : '');
        label.dataset.tagId = tag.id;

        const count = filteredCountForTag(tag, group);
        if (count === 0) label.classList.add('zero-count');
        label.innerHTML = `
            <span class="tag-item-left">
                <input type="checkbox" class="tag-checkbox"
                    data-id="${tag.id}" data-group="${group}"
                    ${selected ? 'checked' : ''}>
                <span class="tag-name">${escapeHtml(tag.name)}</span>
            </span>
            <span class="tag-count">${count}</span>`;

        label.querySelector('input').addEventListener('change', e => {
            toggleTag(tag.id, group, e.target.checked, label);
        });
        return label;
    }

    function renderTagList(containerId, tags, group) {
        const el = document.getElementById(containerId);
        el.innerHTML = '';
        if (!tags.length) {
            el.innerHTML = '<p style="color:var(--text-muted);font-size:.875rem;">Теги не найдены</p>';
            return;
        }
        tags.forEach(t => el.appendChild(renderTagItem(t, group)));
    }

    /* ── Toggle ── */
    function toggleTag(tagId, group, checked, labelEl) {
        const set = group === 'subjects' ? selectedSubjectIds : selectedSystemIds;
        checked ? set.add(tagId) : set.delete(tagId);
        labelEl.classList.toggle('selected', checked);
        updateUI();
    }

    function toggleGroupAll(group, checked) {
        const tags = group === 'subjects' ? allSubjectTags : allSystemTags;
        const set  = group === 'subjects' ? selectedSubjectIds : selectedSystemIds;
        const listId = group === 'subjects' ? 'subjectsList' : 'systemsList';

        tags.forEach(t => checked ? set.add(t.id) : set.delete(t.id));
        document.querySelectorAll(`#${listId} .tag-checkbox`).forEach(cb => {
            cb.checked = checked;
            cb.closest('.tag-item')?.classList.toggle('selected', checked);
        });
        updateUI();
    }

    /* ── Mode pills ── */
    function selectMode(btn) {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        questionMode = btn.dataset.mode;
    }

    function selectTestMode(btn) {
        document.querySelectorAll('[data-test-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        testMode = btn.dataset.testMode;
        const timerField = document.getElementById('timerMinutesField');
        if (timerField) timerField.style.display = testMode === 'standard' ? '' : 'none';
    }

    function selectRandom(btn) {
        document.querySelectorAll('[data-rand]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        randomizeAnswers = btn.dataset.rand === 'true';
    }

    /* ── Update UI ── */
    function updateUI() {
        const total   = selectedSubjectIds.size + selectedSystemIds.size;
        const summary = document.getElementById('builderSummary');
        const startBtn = document.getElementById('startCustomTestBtn');

        // Badges
        setBadge('subjectsBadge', selectedSubjectIds.size, allSubjectTags.length);
        setBadge('systemsBadge',  selectedSystemIds.size,  allSystemTags.length);

        // Master checkboxes
        syncMaster('masterSubjects', selectedSubjectIds, allSubjectTags);
        syncMaster('masterSystems',  selectedSystemIds,  allSystemTags);

        // Счётчики: Subjects фильтруют Systems и наоборот
        refreshFilteredCounts();

        if (total === 0) {
            summary.innerHTML = 'Выберите хотя бы одну тему или систему';
            startBtn.disabled = true;
        } else {
            const parts = [];
            if (selectedSubjectIds.size) parts.push(`${selectedSubjectIds.size} из ${allSubjectTags.length} Subjects`);
            if (selectedSystemIds.size)  parts.push(`${selectedSystemIds.size} из ${allSystemTags.length} Systems`);
            summary.innerHTML = `<strong>Выбрано:</strong> ${parts.join(', ')}`;
            startBtn.disabled = false;
        }
    }

    function setBadge(id, count, total) {
        const el = document.getElementById(id);
        if (!el) return;
        if (count > 0) {
            el.textContent = count === total ? 'Все' : count;
            el.classList.add('visible');
        } else {
            el.classList.remove('visible');
        }
    }

    function syncMaster(masterId, set, tags) {
        const m = document.getElementById(masterId);
        if (!m) return;
        m.indeterminate = false;
        if (set.size === 0) { m.checked = false; }
        else if (set.size === tags.length) { m.checked = true; }
        else { m.checked = false; m.indeterminate = true; }
    }

    /* ── Start test ── */
    async function startCustomTest() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (typeof showNotification === 'function') showNotification('Войдите в аккаунт', 'error');
            setTimeout(() => { window.location.href = '/login'; }, 1200);
            return;
        }

        const questionCount = parseInt(document.getElementById('qCountInput').value, 10) || 40;
        const instantFeedbackMode = testMode === 'instant';

        const btn = document.getElementById('startCustomTestBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span>Подбираем вопросы…';

        try {
            const res = await fetch(`${API_URL}/tests/usmle/custom-test/questions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    testId: currentTestId,
                    subjectTagIds: [...selectedSubjectIds],
                    systemTagIds:  [...selectedSystemIds],
                    questionCount,
                    questionMode,
                    randomizeAnswers,
                    instantFeedbackMode
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || 'Ошибка сервера');
            }

            const questions = await res.json();

            if (!questions.length) {
                if (typeof showNotification === 'function')
                    showNotification('По выбранным фильтрам вопросов нет', 'error');
                btn.disabled = false;
                btn.textContent = 'Начать тест';
                return;
            }

            const useTimer = testMode === 'standard';
            const timerMins = parseInt(document.getElementById('usmleTimerMinutes')?.value || '60') || 60;
            sessionStorage.setItem('testData', JSON.stringify({
                testId: currentTestId,
                questions,
                answers: {},
                questionIndex: 0,
                startTime: Date.now(),
                timer: useTimer ? Math.max(1, timerMins) * 60 : null,
                instantFeedbackMode,
                instantFeedbackLockedQuestions: {},
                isCustomUsmle: true
            }));

            window.location.href = '/test';
        } catch (err) {
            if (typeof showNotification === 'function')
                showNotification(err.message || 'Ошибка', 'error');
            btn.disabled = false;
            btn.textContent = 'Начать тест';
        }
    }

    /* ── Load tags ── */
    async function loadTags() {
        if (!Number.isFinite(currentTestId) || currentTestId <= 0) {
            document.getElementById('builderLoading').innerHTML =
                `<p style="color:var(--danger-color,#dc2626);text-align:center;padding:2rem;">
                    Сначала выберите банк на странице
                    <a href="/usmle" style="color:var(--primary-color);">USMLE</a>
                </p>`;
            return;
        }

        try {
            const res = await fetch(`${API_URL}/tests/usmle/tags/grouped?testId=${currentTestId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();

            const normalizeTag = (t) => ({
                ...t,
                id: Number(t.id),
                questionIds: (t.questionIds || []).map(Number).filter((n) => n > 0),
                questionCount: Number(t.questionCount) || 0
            });
            allSubjectTags = (data.subjects || []).map(normalizeTag);
            allSystemTags  = (data.systems  || []).map(normalizeTag);

            const bankName = (data.test && data.test.name) || currentTestName || 'Банк вопросов';
            const crumb = document.getElementById('builderBreadcrumbName');
            if (crumb) crumb.textContent = bankName;
            const title = document.getElementById('builderTitle');
            if (title) title.textContent = bankName;
            const sub = document.getElementById('builderSubtitle');
            if (sub) {
                const stepLabel = currentStep ? ` · ${currentStep.replace('step', 'Step ')}` : '';
                sub.textContent = `Конструктор${stepLabel}. Выберите Subjects и Systems — только вопросы этого банка.`;
            }

            const st = document.getElementById('subjectsTotal');
            if (st) st.textContent = `${allSubjectTags.length} тем`;
            const syt = document.getElementById('systemsTotal');
            if (syt) syt.textContent = `${allSystemTags.length} систем`;

            renderTagList('subjectsList', allSubjectTags, 'subjects');
            renderTagList('systemsList',  allSystemTags,  'systems');

            document.getElementById('builderLoading').style.display  = 'none';
            document.getElementById('builderContent').style.display  = 'block';
            document.getElementById('builderFooter').style.display   = 'flex';

            updateUI();
        } catch {
            document.getElementById('builderLoading').innerHTML =
                `<p style="color:var(--danger-color,#dc2626);text-align:center;padding:2rem;">
                    Не удалось загрузить теги.
                    <a href="/usmle" style="color:var(--primary-color);">← Вернуться</a>
                </p>`;
        }
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof initTheme === 'function') initTheme();
        if (typeof loadUser === 'function') await loadUser();
        if (typeof setupEventListeners === 'function') setupEventListeners();
        await loadTags();
    });
</script>
</body>
</html>
