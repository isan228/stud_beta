<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USMLE — Создать тест</title>
    <script>
        // Старый URL: если банк уже выбран — в конструктор, иначе — к выбору банка
        try {
            const raw = localStorage.getItem('usmleSelectedBank');
            const bank = raw ? JSON.parse(raw) : null;
            if (bank && bank.id) {
                const name = encodeURIComponent(bank.name || '');
                location.replace(`/usmle-test-builder?testId=${bank.id}&name=${name}&step=${bank.step || 'step1'}`);
            } else {
                location.replace('/usmle');
            }
        } catch {
            location.replace('/usmle');
        }
    </script>
</head>
<body><p>Переход…</p></body>
</html>
