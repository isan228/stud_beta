<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Карточки - stud.kg</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="usmle-app.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="/"><h1>stud.kg</h1></a></div>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Главная</a>
                <a href="/tests" class="nav-link">Тесты</a>
                <a href="/schedule" class="nav-link">Расписание</a>
                <a href="/usmle" class="nav-link">USMLE</a>
                <a href="/rating" class="nav-link">Рейтинг</a>
                <a href="/flashcards" class="nav-link active">Карточки</a>
                <a href="/favorites" class="nav-link" id="favoritesLink" style="display: none;">Избранное</a>
                <a href="/subscriptions" class="nav-link" id="subscriptionsLink" style="display: none;">Подписки</a>
                <a href="/profile" class="nav-link" id="profileLink" style="display: none;">Профиль</a>
                <div class="nav-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <a href="/login" class="btn btn-primary" id="loginBtn">Войти</a>
                    <a href="/register" class="btn btn-secondary" id="registerBtn">Регистрация</a>
                    <button class="btn btn-logout" id="logoutBtn" style="display: none;">Выход</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div id="fcGate" class="tests-hub-empty" style="display:none;"></div>

            <div id="fcApp" class="flashcards-page flashcards-ready-decks hidden">
                <div class="fc-tabs">
                    <button type="button" class="fc-tab active" id="fcTabBrowse">Browse</button>
                    <button type="button" class="fc-tab" id="fcTabStudy">Study</button>
                </div>

                <div id="fcBrowsePanel">
                    <div class="fc-search-bar">
                        <input type="search" id="fcSearchInput" class="fc-search-input" placeholder="Search flashcards…" autocomplete="off">
                    </div>
                    <div id="fcBrowseList" class="fc-browse-list">
                        <p class="flashcard-empty">Загрузка…</p>
                    </div>
                </div>

                <div id="fcStudyPanel" class="hidden">
                    <div class="fc-search-bar fc-study-search-row">
                        <input type="search" id="fcStudySearchInput" class="fc-search-input" placeholder="Search deck names" autocomplete="off">
                    </div>
                    <div class="fc-study-table-wrap">
                        <table class="fc-study-table">
                            <thead>
                                <tr>
                                    <th>Deck</th>
                                    <th>New</th>
                                    <th>Learning</th>
                                    <th>To Review</th>
                                    <th>Last Used</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="fcStudyTableBody">
                                <tr><td colspan="6" class="flashcard-empty">Загрузка…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="fcSessionPanel" class="hidden">
                    <div class="fc-session-meta">
                        <div id="flashcardCategory" class="flashcards-category"></div>
                        <div class="fc-session-view-label">Single Side View</div>
                        <button type="button" class="fc-session-close" id="fcCloseSession" title="Close" aria-label="Close">×</button>
                    </div>

                    <div class="flashcards-card-shell fc-session-card">
                        <div class="flashcards-card-head">
                            <div class="flashcards-side-toggle">
                                <button type="button" id="flashcardToggleFront" class="active">Front</button>
                                <button type="button" id="flashcardToggleBack">Back</button>
                            </div>
                        </div>
                        <div id="flashcardBody" class="flashcards-card-body">
                            <p class="flashcard-empty">Выберите колоду</p>
                        </div>
                    </div>

                    <div class="fc-session-footer">
                        <div id="fcSessionStats" class="fc-session-stats">
                            <span class="fc-stat-new">0</span>
                            <span class="fc-stat-sep">·</span>
                            <span class="fc-stat-learning">0</span>
                            <span class="fc-stat-sep">·</span>
                            <span class="fc-stat-review">0</span>
                        </div>

                        <div id="fcSessionFooterFront" class="fc-session-actions">
                            <button type="button" class="fc-show-answer-btn" id="flashcardActionBtn">Show Answer</button>
                        </div>

                        <div id="fcSessionFooterBack" class="fc-session-actions hidden">
                            <div class="fc-rate-box" id="flashcardRateBox">
                                <button type="button" class="fc-rate-btn fc-rate-again" id="flashcardRateAgain">
                                    <span class="fc-rate-interval">&lt;1m</span>
                                    <span class="fc-rate-label">Again</span>
                                </button>
                                <button type="button" class="fc-rate-btn fc-rate-good" id="flashcardRateGood">
                                    <span class="fc-rate-interval">&lt;10m</span>
                                    <span class="fc-rate-label">Good</span>
                                </button>
                                <button type="button" class="fc-rate-btn fc-rate-easy" id="flashcardRateEasy">
                                    <span class="fc-rate-interval">4d</span>
                                    <span class="fc-rate-label">Easy</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="notification" class="notification"></div>
    <script src="app.js"></script>
    <script src="flashcards.js"></script>
</body>
</html>
