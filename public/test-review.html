<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icon-192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta property="og:image" content="https://stud.kg/img/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1e3a5f">
    <title>Разбор ошибок - stud.kg</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="test-review-page uworld-review-page">
    <header class="uworld-session-topbar uworld-review-session-bar">
        <div class="uworld-tb-left">
            <button type="button" class="uworld-tb-icon-btn" id="reviewTbMenu" title="Items" aria-label="Открыть список вопросов">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="uworld-tb-item-info">
                <span class="uworld-tb-item-label" id="reviewItemLabel">Item 1 of 1</span>
                <span class="uworld-tb-qid" id="reviewQuestionId"></span>
            </div>
        </div>
        <div class="uworld-tb-tools" role="toolbar" aria-label="Review tools">
            <button type="button" class="uworld-tb-tool" id="reviewTbFullscreen" title="Full Screen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Full Screen</span>
            </button>
            <button type="button" class="uworld-tb-tool" id="reviewTbNotes" title="Notes">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 3v5h5M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Notes</span>
            </button>
            <button type="button" class="uworld-tb-tool" id="reviewTbLab" title="Lab Values">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v5.2L5.8 18.2A2.2 2.2 0 0 0 7.8 21h8.4a2.2 2.2 0 0 0 2-2.8L14 8.2V3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.2 14h7.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Lab Values</span>
            </button>
            <button type="button" class="uworld-tb-tool" id="reviewTbCalc" title="Calculator">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="8" y="6" width="8" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>Calculator</span>
            </button>
            <a href="/test-result" class="uworld-tb-tool" id="backToResultBtn" title="Results">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M8 17v-6M12 17V8M16 17v-4M20 17V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>Results</span>
            </a>
        </div>
        <div class="uworld-tb-nav">
            <button type="button" class="uworld-tb-nav-btn" id="reviewPrevBtn" title="Previous">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Previous</span>
            </button>
            <button type="button" class="uworld-tb-nav-btn" id="reviewNextBtn" title="Next">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Next</span>
            </button>
            <a href="/tests" class="uworld-tb-nav-btn uworld-tb-end" id="endReviewBtn">
                <span>End</span>
            </a>
        </div>
    </header>

    <div class="uworld-review-shell">
        <aside class="usmle-qnav uworld-review-qnav" id="reviewQuestionNav" aria-label="Навигация по вопросам">
            <div class="usmle-qnav-title">Items</div>
            <ol class="usmle-qnav-list" id="reviewQuestionNavList"></ol>
        </aside>

        <div class="uworld-review-split" id="reviewSplit">
            <section class="uworld-review-pane uworld-review-left" id="reviewLeft">
                <div style="padding:2rem;color:#64748b;">Загрузка…</div>
            </section>
            <section class="uworld-review-pane uworld-review-right" id="reviewRight">
                <div class="uworld-review-expl-head">
                    <span>Explanation</span>
                </div>
                <div id="reviewExplanationBody" class="uworld-review-expl-body"></div>
            </section>
        </div>
    </div>

    <footer class="uworld-review-footer">
        <div class="uworld-review-footer-left">
            <span id="reviewTestName">Разбор теста</span>
            <span id="reviewScoreSummary"></span>
        </div>
        <div class="uworld-review-footer-right">
            <a href="/usmle-test-builder" class="uworld-review-back-tests-btn" id="backToTestsBtn">Назад к тестам</a>
            <a href="/tests" class="uworld-review-end-btn" id="endReviewBtnFooter">End Review</a>
        </div>
    </footer>

    <div id="usmleLabModal" class="uworld-lab-dock" hidden>
        <div class="uworld-lab-dock-inner" id="usmleLabTables"></div>
    </div>
    <div id="usmleNotesModal" class="modal uworld-tool-modal" style="display:none;">
        <div class="modal-content uworld-tool-modal-content" style="max-width:520px;">
            <span class="modal-close" id="usmleNotesModalClose">&times;</span>
            <h2>Notes</h2>
            <textarea id="usmleNotesTextarea" rows="10" placeholder="Your notes…"></textarea>
            <div style="margin-top:0.75rem;display:flex;gap:0.5rem;justify-content:flex-end;">
                <button type="button" class="btn btn-primary" id="usmleNotesSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>
    <div id="usmleCalcModal" class="modal uworld-tool-modal" style="display:none;">
        <div class="modal-content uworld-tool-modal-content uworld-calc-modal" style="max-width:320px;">
            <span class="modal-close" id="usmleCalcModalClose">&times;</span>
            <h2>Calculator</h2>
            <input type="text" id="usmleCalcDisplay" class="uworld-calc-display" readonly value="0">
            <div class="uworld-calc-pad" id="usmleCalcPad"></div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    <script src="usmle-linked-question.js"></script>
    <script src="usmle-annotations.js"></script>
    <script src="usmle-lab-values.js"></script>
    <script src="app.js"></script>
    <script src="test-review.js"></script>
</body>
</html>
