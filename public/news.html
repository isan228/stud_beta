<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icon-192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta property="og:image" content="https://stud.kg/img/icon-192.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="192">
    <meta property="og:image:height" content="192">
    <meta name="twitter:image" content="https://stud.kg/img/icon-192.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2563eb">
    <title>Новости - stud.kg</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/">
                    <h1>stud.kg</h1>
                </a>
            </div>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Главная</a>
                <a href="/tests" class="nav-link">Тесты</a>
                <a href="/usmle" class="nav-link">USMLE</a>
                <a href="/flashcards" class="nav-link">Карточки</a>
                <a href="/favorites" class="nav-link" id="favoritesLink" style="display: none;">Избранное</a>
                <a href="/profile" class="nav-link" id="profileLink" style="display: none;">Профиль</a>
                <div class="nav-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <a href="/login" class="btn btn-primary" id="loginBtn">Войти</a>
                    <a href="/register" class="btn btn-secondary" id="registerBtn">Регистрация</a>
                    <button class="btn btn-logout" id="logoutBtn" style="display: none;">Выход</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Новости и обновления</h1>
                <p class="page-description">
                    Следите за последними новостями платформы, обновлениями и полезными материалами для подготовки к
                    экзаменам.
                </p>
            </div>
            <div id="newsList" class="news-grid"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>stud.kg</h3>
                    <p>Платформа для подготовки к экзаменам</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 stud.kg. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <div id="notification" class="notification"></div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadUser();
            setupEventListeners();
            loadNews();
        });
    </script>
</body>

</html>
